name: Android checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace
      - name: Summarize verification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites = [ET.parse(path).getroot() for path in files]
          counts = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          message = ', '.join(f'{value} {key}' for key, value in counts.items())
          print(f'::notice title=Unit test results::{message}')
          apks = glob.glob('app/build/outputs/apk/debug/*.apk')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Android verification\n\n{message}\n\n')
              summary.write('Download **kattpad-debug-apk** from this run’s Artifacts section.\n\n' if apks else 'No APK was generated.\n\n')
              summary.write('Debug APKs are development builds, not production releases.\n')
          PYTHON
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: kattpad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload check reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: android-check-reports
          path: app/build/reports/
          if-no-files-found: warn
          retention-days: 14
